<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>AYCF — קונסולת חיפוש</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body,#root{height:100%}
  body{margin:0;background:#EDF0F4}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const C = { paper:"#EDF0F4", card:"#FFFFFF", ink:"#141B2D", muted:"#6B7689",
  line:"#D3D9E2", wizz:"#C6007E", live:"#0F7A6C", warn:"#B5761A", warnBg:"#FBF1DF" };
const MONO = "'IBM Plex Mono', ui-monospace, monospace";
const DISPLAY = "'Barlow Condensed', 'Arial Narrow', sans-serif";
const BODY = "'Inter', system-ui, sans-serif";
const DEFAULT_AIRPORTS = { TLV:"תל אביב", FCO:"רומא", BUD:"בודפשט", ATH:"אתונה",
  MXP:"מילאנו", LCA:"לרנקה", OTP:"בוקרשט", SOF:"סופיה", KRK:"קרקוב", KTW:"קטוביץ",
  WAW:"ורשה", GDN:"גדנסק", NAP:"נאפולי", CDG:"פריז", BCN:"ברצלונה", VIE:"וינה" };

const HOURS = (ms) => ms / 36e5;

function findPaths(flights, origin, dest, f) {
  const byOrigin = {};
  flights.forEach((fl) => (byOrigin[fl.origin] = byOrigin[fl.origin] || []).push(fl));
  Object.values(byOrigin).forEach((a) => a.sort((x, y) => x.depart - y.depart));
  const out = [];
  const walk = (here, chain, seen) => {
    for (const l of byOrigin[here] || []) {
      if (seen.has(l.dest)) continue;
      if (chain.length) {
        const gap = HOURS(l.depart - chain[chain.length - 1].arrive);
        if (f.connection.on && (gap < f.connection.min || gap > f.connection.max)) continue;
        if (f.noOvernight.on && chain[chain.length - 1].arrive.getDate() !== l.depart.getDate()) continue;
      } else {
        const h = l.depart.getHours();
        if (f.departWindow.on && (h < f.departWindow.from || h > f.departWindow.to)) continue;
        if (f.weekend.on && ![4, 5, 6].includes(l.depart.getDay())) continue;
      }
      chain.push(l);
      if (l.dest === dest) out.push([...chain]);
      if (chain.length < f.maxLegs) walk(l.dest, chain, new Set([...seen, l.dest]));
      chain.pop();
    }
  };
  walk(origin, [], new Set([origin]));
  return out;
}

function Switch({ on, onChange }) {
  return (
    <button onClick={() => onChange(!on)} aria-pressed={on}
      className="relative rounded-full transition-colors shrink-0"
      style={{ width: 40, height: 22, background: on ? C.wizz : C.line, outlineOffset: 2 }}>
      <span className="absolute rounded-full bg-white transition-all"
        style={{ width: 16, height: 16, top: 3, left: on ? 21 : 3 }} />
    </button>
  );
}
function Filter({ label, hint, on, onToggle, children }) {
  return (
    <div className="py-3" style={{ borderBottom: `1px solid ${C.line}` }}>
      <div className="flex items-center gap-3">
        <Switch on={on} onChange={onToggle} />
        <div className="flex-1 min-w-0">
          <div style={{ fontWeight: 600, fontSize: 14 }}>{label}</div>
          {hint && <div style={{ fontSize: 12, color: C.muted }}>{hint}</div>}
        </div>
      </div>
      {on && children && <div className="mt-3">{children}</div>}
    </div>
  );
}
function Code({ children }) {
  return <span style={{ fontFamily: MONO, fontWeight: 600, letterSpacing: "0.02em" }}>{children}</span>;
}
const fmtTime = (d) => d.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
const fmtDay = (d) => d.toLocaleDateString("he-IL", { weekday: "short", day: "numeric", month: "numeric" });

function gcal(legs) {
  const p = (d) => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const f = legs[0], l = legs[legs.length-1];
  const text = encodeURIComponent(`טיסה ${f.origin}→${l.dest}`);
  const det = encodeURIComponent(legs.map(x=>`${x.flightNo}: ${x.origin}→${x.dest} ${fmtTime(x.depart)}–${fmtTime(x.arrive)}`).join("\n"));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${p(f.depart)}/${p(l.arrive)}&details=${det}`;
}

function Strip({ legs }) {
  const first = legs[0], last = legs[legs.length - 1];
  const total = HOURS(last.arrive - first.depart);
  return (
    <div className="mb-3 overflow-hidden" dir="ltr"
      style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10 }}>
      <div className="flex items-stretch">
        <div style={{ width: 6, background: legs.length > 1 ? C.warn : C.live }} />
        <div className="flex-1 p-3">
          {legs.map((l, i) => (
            <div key={i}>
              {i > 0 && (
                <div className="flex items-center gap-2 my-1" style={{ fontSize: 11, color: C.muted, fontFamily: MONO }}>
                  <span style={{ flex: 1, borderTop: `1px dashed ${C.line}` }} />
                  <span>{HOURS(l.depart - legs[i - 1].arrive).toFixed(1)}h in {l.origin}</span>
                  <span style={{ flex: 1, borderTop: `1px dashed ${C.line}` }} />
                </div>
              )}
              <div className="flex items-baseline justify-between gap-2">
                <div className="flex items-baseline gap-2">
                  <span style={{ fontFamily: DISPLAY, fontSize: 26, lineHeight: 1 }}>{l.origin}</span>
                  <span style={{ color: C.muted }}>→</span>
                  <span style={{ fontFamily: DISPLAY, fontSize: 26, lineHeight: 1 }}>{l.dest}</span>
                </div>
                <div style={{ textAlign: "right" }}>
                  <Code><span style={{ fontSize: 14 }}>{fmtTime(l.depart)}–{fmtTime(l.arrive)}</span></Code>
                  <div style={{ fontSize: 11, color: C.muted, fontFamily: MONO }}>
                    <bdi>{fmtDay(l.depart)}</bdi> · {l.flightNo}
                  </div>
                </div>
              </div>
            </div>
          ))}
          <div className="flex justify-between items-center mt-2 pt-2"
            style={{ borderTop: `1px solid ${C.line}`, fontSize: 12, color: C.muted, fontFamily: MONO }}>
            <span>{total.toFixed(1)}h · €{(legs.length * 9.99).toFixed(2)} · {legs.length} seg</span>
            <a href={gcal(legs)} target="_blank" rel="noopener"
               style={{ color: C.wizz, fontWeight: 600, textDecoration: "none" }}>📅 יומן</a>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(false);
  const load = () => fetch("data.json?t=" + Date.now()).then(r => r.json()).then(setData).catch(() => setErr(true));
  useEffect(() => { load(); const t = setInterval(load, 120000); return () => clearInterval(t); }, []);

  const flights = useMemo(() => (data?.flights || []).map(f => ({
    origin: f.origin, dest: f.dest, depart: new Date(f.depart), arrive: new Date(f.arrive), flightNo: f.flightNo,
  })), [data]);
  const AIRPORTS = (data && data.airports) || DEFAULT_AIRPORTS;
  const present = useMemo(() => {
    const s = new Set(); flights.forEach(f => { s.add(f.origin); s.add(f.dest); });
    return [...s].sort();
  }, [flights]);
  const home = (data && data.home) || "TLV";

  const [mode, setMode] = useState("out");
  const [from, setFrom] = useState("TLV");
  const [to, setTo] = useState("BUD");
  const [maxLegs, setMaxLegs] = useState(2);
  const [f, setF] = useState({
    departWindow: { on: false, from: 6, to: 22 },
    weekend: { on: false },
    connection: { on: true, min: 3, max: 30 },
    noOvernight: { on: false },
    directFirst: { on: true },
    stay: { on: false, days: [1, 2, 3] },
    returnRequired: { on: false },
  });
  const set = (k, patch) => setF((p) => ({ ...p, [k]: { ...p[k], ...patch } }));

  // land on the destination with the most outbound flights from `from`
  useEffect(() => {
    if (!flights.length) return;
    if (flights.some(fl => fl.origin === from && fl.dest === to)) return;
    const counts = {};
    flights.forEach(fl => { if (fl.origin === from) counts[fl.dest] = (counts[fl.dest] || 0) + 1; });
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (best) setTo(best[0]);
  }, [flights, from]);

  const results = useMemo(() => {
    const paths = findPaths(flights, from, to, { ...f, maxLegs });
    return f.directFirst.on
      ? [...paths].sort((a, b) => a.length - b.length || a[0].depart - b[0].depart)
      : [...paths].sort((a, b) => a[0].depart - b[0].depart);
  }, [flights, from, to, f, maxLegs]);

  const trips = useMemo(() => {
    if (mode !== "out") return [];
    const back = findPaths(flights, to, from, { ...f, maxLegs, weekend: { on: false }, departWindow: { on: false } });
    return results.map((out) => {
      const arrive = out[out.length - 1].arrive;
      const returns = back.filter((r) => {
        if (!f.stay.on) return HOURS(r[0].depart - arrive) >= 6;
        const nights = Math.max(1, Math.round(HOURS(r[0].depart - arrive) / 24));
        return f.stay.days.includes(nights) && r[0].depart > arrive;
      });
      return { out, returns };
    }).filter((t) => !f.returnRequired.on || t.returns.length > 0);
  }, [mode, flights, from, to, f, maxLegs, results]);

  const activeCount = Object.values(f).filter((x) => x.on).length;

  if (err) return (
    <div dir="rtl" style={{ padding: 30, fontFamily: BODY, color: C.ink, textAlign: "center" }}>
      <div style={{ fontSize: 40 }}>✈️</div>
      <p>לא הצלחתי לטעון נתונים. נסה לרענן עוד רגע.</p>
    </div>
  );
  if (!data) return (
    <div dir="rtl" style={{ padding: 40, fontFamily: BODY, color: C.muted, textAlign: "center" }}>טוען…</div>
  );

  const updated = new Date(data.updated);
  const airportOptions = (present.length ? present : Object.keys(AIRPORTS));

  return (
    <div dir="rtl" style={{ background: C.paper, color: C.ink, fontFamily: BODY, minHeight: "100%" }}>
      <div className="mx-auto p-4" style={{ maxWidth: 520 }}>
        <header className="mb-4">
          <div style={{ fontSize: 11, letterSpacing: "0.18em", color: C.wizz, fontFamily: MONO }}>ALL YOU CAN FLY</div>
          <h1 style={{ fontFamily: DISPLAY, fontSize: 40, lineHeight: 1, margin: "2px 0" }}>קונסולת חיפוש</h1>
          <p style={{ fontSize: 13, color: C.muted }}>
            עודכן {fmtTime(updated)} · {flights.length} טיסות פתוחות · מתעדכן כל 30 דק׳
          </p>
        </header>

        <div className="flex gap-2 mb-4">
          {[["out", "חיפוש יעד"], ["home", "תחזיר אותי הביתה"]].map(([k, label]) => (
            <button key={k}
              onClick={() => { setMode(k); if (k === "home") { setTo(home); } else { setFrom(home); } }}
              className="flex-1 py-2 rounded-lg"
              style={{ fontSize: 13, fontWeight: 600,
                background: mode === k ? C.ink : "transparent",
                color: mode === k ? "#fff" : C.muted,
                border: `1px solid ${mode === k ? C.ink : C.line}` }}>{label}</button>
          ))}
        </div>

        <div className="flex gap-2 mb-4">
          {[["מאיפה", from, setFrom], ["לאן", to, setTo]].map(([label, val, setter]) => (
            <label key={label} className="flex-1">
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>{label}</div>
              <select value={val} onChange={(e) => setter(e.target.value)} className="w-full p-2 rounded-lg"
                style={{ background: C.card, border: `1px solid ${C.line}`, fontFamily: MONO, fontSize: 14 }}>
                {airportOptions.map((code) => (
                  <option key={code} value={code}>{code} · {AIRPORTS[code] || code}</option>
                ))}
              </select>
            </label>
          ))}
        </div>

        <section className="mb-4 p-4 rounded-xl" style={{ background: C.card, border: `1px solid ${C.line}` }}>
          <div className="flex items-baseline justify-between mb-1">
            <h2 style={{ fontFamily: DISPLAY, fontSize: 22 }}>פילטרים</h2>
            <span style={{ fontSize: 11, color: C.muted, fontFamily: MONO }}>{activeCount} פעילים</span>
          </div>

          <Filter label="שעת המראה" hint="רק טיסות שיוצאות בטווח הזה"
            on={f.departWindow.on} onToggle={(v) => set("departWindow", { on: v })}>
            <div dir="ltr" className="flex items-center gap-2" style={{ fontFamily: MONO, fontSize: 13 }}>
              <input type="range" min="0" max="23" value={f.departWindow.from}
                onChange={(e) => set("departWindow", { from: +e.target.value })} className="flex-1" />
              <span>{String(f.departWindow.from).padStart(2,"0")}:00–{String(f.departWindow.to).padStart(2,"0")}:00</span>
              <input type="range" min="0" max="23" value={f.departWindow.to}
                onChange={(e) => set("departWindow", { to: +e.target.value })} className="flex-1" />
            </div>
          </Filter>

          <Filter label="סופ״ש בלבד" hint="יציאה בחמישי, שישי או שבת"
            on={f.weekend.on} onToggle={(v) => set("weekend", { on: v })} />

          <Filter label="זמן חיבור" hint="הרגליים הן הזמנות נפרדות — אין הגנה על החיבור"
            on={f.connection.on} onToggle={(v) => set("connection", { on: v })}>
            <div dir="ltr" className="flex items-center gap-2" style={{ fontFamily: MONO, fontSize: 13 }}>
              <span>min</span>
              <input type="range" min="1" max="12" value={f.connection.min}
                onChange={(e) => set("connection", { min: +e.target.value })} className="flex-1" />
              <span>{f.connection.min}h</span>
            </div>
          </Filter>

          <Filter label="בלי לינה בשדה" hint="פוסל חיבורים שחוצים חצות"
            on={f.noOvernight.on} onToggle={(v) => set("noOvernight", { on: v })} />
          <Filter label="ישירות קודם" hint="ממיין מסלולים קצרים למעלה"
            on={f.directFirst.on} onToggle={(v) => set("directFirst", { on: v })} />
          <Filter label="רק עם חזרה זמינה" hint="מסתיר כל הלוך שאין לו טיסת חזרה פתוחה עכשיו"
            on={f.returnRequired.on} onToggle={(v) => set("returnRequired", { on: v })} />

          <Filter label="משך שהות ביעד" hint="כמה לילות ביעד"
            on={f.stay.on} onToggle={(v) => set("stay", { on: v })}>
            <div className="flex gap-1 flex-wrap">
              {[1, 2, 3, 4, 5, 7].map((d) => {
                const active = f.stay.days.includes(d);
                return (
                  <button key={d}
                    onClick={() => set("stay", { days: active ? f.stay.days.filter((x) => x !== d) : [...f.stay.days, d] })}
                    className="py-2 rounded-lg"
                    style={{ flex: "1 0 40px", fontFamily: MONO, fontSize: 13,
                      background: active ? C.wizz : "transparent", color: active ? "#fff" : C.muted,
                      border: `1px solid ${active ? C.wizz : C.line}` }}>{d}</button>
                );
              })}
            </div>
          </Filter>

          <div className="pt-3">
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>מקסימום קפיצות</div>
            <div className="flex gap-2">
              {[1, 2, 3].map((n) => (
                <button key={n} onClick={() => setMaxLegs(n)} className="flex-1 py-2 rounded-lg"
                  style={{ fontFamily: MONO, fontSize: 14,
                    background: maxLegs === n ? C.ink : "transparent", color: maxLegs === n ? "#fff" : C.muted,
                    border: `1px solid ${maxLegs === n ? C.ink : C.line}` }}>{n}</button>
              ))}
            </div>
          </div>
        </section>

        <div className="flex items-baseline justify-between mb-2">
          <h2 style={{ fontFamily: DISPLAY, fontSize: 22 }}>{mode === "out" ? trips.length : results.length} מסלולים</h2>
          <span style={{ fontSize: 11, color: C.muted, fontFamily: MONO }}>{from} → {to}</span>
        </div>

        {(mode === "out" ? trips.length : results.length) === 0 ? (
          <div className="p-4 rounded-xl" style={{ background: C.warnBg, border: `1px solid ${C.warn}33`, fontSize: 13 }}>
            אין מסלול שעובר את הפילטרים. נסה לכבות "בלי לינה בשדה", להוריד "זמן חיבור", או להעלות מקסימום קפיצות.
          </div>
        ) : mode === "out" ? (
          trips.map(({ out, returns }, i) => (
            <div key={i} className="mb-5">
              <div style={{ fontSize: 11, fontFamily: MONO, color: C.muted, marginBottom: 4 }}>הלוך</div>
              <Strip legs={out} />
              <div style={{ fontSize: 11, fontFamily: MONO, color: C.muted, margin: "10px 0 4px" }}>
                חזור · {returns.length} אופציות
              </div>
              {returns.length === 0 ? (
                <div className="p-3 rounded-lg" style={{ background: C.warnBg, fontSize: 12, color: C.warn }}>
                  החזרה עדיין מחוץ לחלון ה-72 שעות. הבוט יעדכן כשתיפתח.
                </div>
              ) : returns.slice(0, 4).map((r, j) => <Strip key={j} legs={r} />)}
            </div>
          ))
        ) : (
          results.map((legs, i) => <Strip key={i} legs={legs} />)
        )}

        <footer style={{ textAlign: "center", color: C.muted, fontSize: 11, fontFamily: MONO, padding: "20px 0" }}>
          Wizz AYCF · חלון הזמנות 72 שעות · כל רגל הזמנה נפרדת €9.99
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
