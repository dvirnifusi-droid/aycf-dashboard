<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#EDF0F4" />
<title>AYCF — קונסולת חיפוש</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#EDF0F4; --card:#fff; --ink:#141B2D; --muted:#6B7689;
    --line:#D3D9E2; --wizz:#C6007E; --live:#0F7A6C; --warn:#B5761A; --warnBg:#FBF1DF;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --disp:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;padding:16px}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--wizz);font-family:var(--mono)}
  h1{font-family:var(--disp);font-size:40px;line-height:1;margin:2px 0}
  .sub{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:8px}
  .mb4{margin-bottom:16px}.mb2{margin-bottom:8px}
  .seg{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:600;
       background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer;text-align:center}
  .seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  label.fld{flex:1}
  .fld .lab{font-size:11px;color:var(--muted);margin-bottom:4px}
  select{width:100%;padding:9px;border-radius:10px;background:var(--card);
         border:1px solid var(--line);font-family:var(--mono);font-size:14px;color:var(--ink)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h2{font-family:var(--disp);font-size:22px;margin:0}
  .flt{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .flt .txt{flex:1;min-width:0}
  .flt .lbl{font-weight:600;font-size:14px}
  .flt .hint{font-size:12px;color:var(--muted)}
  .flt .extra{width:100%;margin-top:10px}
  .sw{position:relative;width:40px;height:22px;border-radius:99px;background:var(--line);
      border:none;flex-shrink:0;cursor:pointer;transition:background .15s}
  .sw.on{background:var(--wizz)}
  .sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;
        background:#fff;transition:left .15s}
  .sw.on i{left:21px}
  input[type=range]{width:100%;accent-color:var(--wizz)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{flex:1 0 42px;padding:9px 0;border-radius:9px;font-family:var(--mono);font-size:13px;
        background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer}
  .chip.on{background:var(--wizz);color:#fff;border-color:var(--wizz)}
  .chip.ink.on{background:var(--ink);border-color:var(--ink)}
  .strip{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
         display:flex;background:var(--card)}
  .strip .bar{width:6px;background:var(--live)}
  .strip.multi .bar{background:var(--warn)}
  .strip .in{flex:1;padding:12px;direction:ltr}
  .leg{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .leg .od{display:flex;gap:8px;align-items:baseline}
  .leg .ap{font-family:var(--disp);font-size:26px;line-height:1}
  .leg .ar{color:var(--muted)}
  .leg .tm{font-family:var(--mono);font-weight:600;font-size:14px;text-align:right}
  .leg .meta{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .lay{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .lay .ln{flex:1;border-top:1px dashed var(--line)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
        padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-family:var(--mono)}
  .foot .acts{display:flex;gap:10px;align-items:center}
  .book{color:#fff;background:var(--wizz);padding:4px 11px;border-radius:7px;font-weight:600;text-decoration:none}
  .cal{color:var(--wizz);font-weight:600;text-decoration:none}
  .tag{font-size:11px;color:var(--muted);font-family:var(--mono);margin:10px 0 4px}
  .note{background:var(--warnBg);color:var(--warn);font-size:12px;padding:10px;border-radius:9px}
  .empty{background:var(--warnBg);border:1px solid rgba(181,118,26,.2);font-size:13px;padding:16px;border-radius:12px}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:11px;font-family:var(--mono);padding:20px 0}
  a{color:inherit}
</style>
</head>
<body>
<div class="wrap" id="app"><p style="color:var(--muted);text-align:center;padding:40px">טוען…</p></div>
<script>
"use strict";
var BOOK_URL = "https://multipass.wizzair.com/w6/subscriptions/spa/private-page/wallets";
var DEF_AIRPORTS = {TLV:"תל אביב",FCO:"רומא",BUD:"בודפשט",ATH:"אתונה",MXP:"מילאנו",
  LCA:"לרנקה",OTP:"בוקרשט",SOF:"סופיה",KRK:"קרקוב",KTW:"קטוביץ",WAW:"ורשה",
  GDN:"גדנסק",NAP:"נאפולי",CDG:"פריז",BCN:"ברצלונה",VIE:"וינה"};
var HOURS = function(ms){return ms/36e5;};
var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

var S = {
  data:null, err:false, mode:"out", from:"TLV", to:"BUD", maxLegs:2,
  f:{ departWindow:{on:false,from:6,to:22}, weekend:{on:false},
      connection:{on:true,min:3,max:30}, noOvernight:{on:false},
      directFirst:{on:true}, returnRequired:{on:false}, stay:{on:false,days:[1,2,3]} }
};

function fmtTime(d){return d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});}
function fmtDay(d){return d.toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"});}
function airports(){return (S.data&&S.data.airports)||DEF_AIRPORTS;}
function apName(c){return airports()[c]||c;}

function flights(){
  return ((S.data&&S.data.flights)||[]).map(function(f){
    return {origin:f.origin,dest:f.dest,depart:new Date(f.depart),arrive:new Date(f.arrive),flightNo:f.flightNo};
  });
}
function presentAirports(){
  var s={}; flights().forEach(function(f){s[f.origin]=1;s[f.dest]=1;});
  return Object.keys(s).sort();
}

function findPaths(fls, origin, dest, f){
  var byO={}; fls.forEach(function(l){(byO[l.origin]=byO[l.origin]||[]).push(l);});
  Object.keys(byO).forEach(function(k){byO[k].sort(function(a,b){return a.depart-b.depart;});});
  var out=[];
  function walk(here,chain,seen){
    (byO[here]||[]).forEach(function(l){
      if(seen[l.dest]) return;
      if(chain.length){
        var gap=HOURS(l.depart-chain[chain.length-1].arrive);
        if(f.connection.on&&(gap<f.connection.min||gap>f.connection.max)) return;
        if(f.noOvernight.on&&chain[chain.length-1].arrive.getDate()!==l.depart.getDate()) return;
      }else{
        var h=l.depart.getHours();
        if(f.departWindow.on&&(h<f.departWindow.from||h>f.departWindow.to)) return;
        if(f.weekend.on&&[4,5,6].indexOf(l.depart.getDay())<0) return;
      }
      chain.push(l);
      if(l.dest===dest) out.push(chain.slice());
      if(chain.length<f.maxLegs){var ns=Object.assign({},seen);ns[l.dest]=1;walk(l.dest,chain,ns);}
      chain.pop();
    });
  }
  var s0={}; s0[origin]=1; walk(origin,[],s0);
  return out;
}

function gcal(legs){
  var p=function(d){return d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
  var f=legs[0],l=legs[legs.length-1];
  var text=encodeURIComponent("טיסה "+f.origin+"→"+l.dest);
  var det=encodeURIComponent(legs.map(function(x){return x.flightNo+": "+x.origin+"→"+x.dest+" "+fmtTime(x.depart)+"–"+fmtTime(x.arrive);}).join("\n"));
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+text+"&dates="+p(f.depart)+"/"+p(l.arrive)+"&details="+det;
}

function stripHTML(legs){
  var first=legs[0],last=legs[legs.length-1],total=HOURS(last.arrive-first.depart);
  var body="";
  legs.forEach(function(l,i){
    if(i>0){
      var w=HOURS(l.depart-legs[i-1].arrive).toFixed(1);
      body+='<div class="lay"><span class="ln"></span><span>'+w+'h in '+l.origin+'</span><span class="ln"></span></div>';
    }
    body+='<div class="leg"><div class="od"><span class="ap">'+l.origin+'</span><span class="ar">→</span><span class="ap">'+l.dest+'</span></div>'
      +'<div><div class="tm">'+fmtTime(l.depart)+'–'+fmtTime(l.arrive)+'</div>'
      +'<div class="meta"><bdi>'+fmtDay(l.depart)+'</bdi> · '+esc(l.flightNo)+'</div></div></div>';
  });
  return '<div class="strip'+(legs.length>1?' multi':'')+'"><div class="bar"></div><div class="in">'+body
    +'<div class="foot"><span>'+total.toFixed(1)+'h · €'+(legs.length*9.99).toFixed(2)+' · '+legs.length+' seg</span>'
    +'<span class="acts"><a class="book" href="'+BOOK_URL+'" target="_blank" rel="noopener">🎟 הזמנה</a>'
    +'<a class="cal" href="'+gcal(legs)+'" target="_blank" rel="noopener">📅 יומן</a></span></div></div></div>';
}

function results(){
  var f=Object.assign({},S.f,{maxLegs:S.maxLegs});
  var paths=findPaths(flights(),S.from,S.to,f);
  paths.sort(S.f.directFirst.on
    ? function(a,b){return a.length-b.length||a[0].depart-b[0].depart;}
    : function(a,b){return a[0].depart-b[0].depart;});
  return paths;
}
function trips(){
  var f=Object.assign({},S.f,{maxLegs:S.maxLegs});
  var back=findPaths(flights(),S.to,S.from,Object.assign({},f,{weekend:{on:false},departWindow:{on:false}}));
  return results().map(function(out){
    var arrive=out[out.length-1].arrive;
    var returns=back.filter(function(r){
      if(r[0].depart<=arrive) return false;
      if(!S.f.stay.on) return HOURS(r[0].depart-arrive)>=6;
      var nights=Math.max(1,Math.round(HOURS(r[0].depart-arrive)/24));
      return S.f.stay.days.indexOf(nights)>=0;
    });
    return {out:out,returns:returns};
  }).filter(function(t){return !S.f.returnRequired.on||t.returns.length>0;});
}

function filterRow(key,label,hint,extra){
  var on=S.f[key].on;
  return '<div class="flt"><button class="sw'+(on?' on':'')+'" data-toggle="'+key+'"><i></i></button>'
    +'<div class="txt"><div class="lbl">'+label+'</div><div class="hint">'+hint+'</div>'
    +(on&&extra?'<div class="extra">'+extra+'</div>':'')+'</div></div>';
}

function render(){
  var app=document.getElementById("app");
  if(S.err){app.innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:40px">✈️</div><p>לא הצלחתי לטעון נתונים. נסה לרענן.</p></div>';return;}
  if(!S.data){app.innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">טוען…</p>';return;}

  var fls=flights(), pres=presentAirports();
  var opts=(pres.length?pres:Object.keys(airports())).map(function(c){
    return '<option value="'+c+'">'+c+' · '+esc(apName(c))+'</option>';}).join("");
  var updated=new Date(S.data.updated);

  var list, count;
  if(S.mode==="out"){
    var ts=trips(); count=ts.length;
    list=ts.length? ts.map(function(t){
      var back = t.returns.length
        ? t.returns.slice(0,4).map(stripHTML).join("")
        : '<div class="note">החזרה עדיין מחוץ לחלון ה-72 שעות. הבוט יעדכן כשתיפתח.</div>';
      return '<div style="margin-bottom:20px"><div class="tag">הלוך</div>'+stripHTML(t.out)
        +'<div class="tag">חזור · '+t.returns.length+' אופציות</div>'+back+'</div>';
    }).join("") : "";
  }else{
    var rs=results(); count=rs.length;
    list=rs.map(stripHTML).join("");
  }
  if(!count) list='<div class="empty">אין מסלול שעובר את הפילטרים. נסה לכבות "בלי לינה בשדה", להוריד "זמן חיבור", או להעלות מקסימום קפיצות.</div>';

  var active=Object.keys(S.f).filter(function(k){return S.f[k].on;}).length;
  var dw=S.f.departWindow, cn=S.f.connection;

  app.innerHTML=''
  +'<header class="mb4"><div class="eyebrow">ALL YOU CAN FLY</div><h1>קונסולת חיפוש</h1>'
  +'<p class="sub">עודכן '+fmtTime(updated)+' · '+fls.length+' טיסות פתוחות · מתעדכן כל 30 דק׳</p></header>'

  +'<div class="row mb4">'
    +'<button class="seg'+(S.mode==="out"?" on":"")+'" data-mode="out">חיפוש יעד</button>'
    +'<button class="seg'+(S.mode==="home"?" on":"")+'" data-mode="home">תחזיר אותי הביתה</button></div>'

  +'<div class="row mb4">'
    +'<label class="fld"><div class="lab">מאיפה</div><select data-set="from">'+opts.replace('value="'+S.from+'"','value="'+S.from+'" selected')+'</select></label>'
    +'<label class="fld"><div class="lab">לאן</div><select data-set="to">'+opts.replace('value="'+S.to+'"','value="'+S.to+'" selected')+'</select></label></div>'

  +'<section class="panel mb4">'
    +'<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px"><h2>פילטרים</h2><span class="count">'+active+' פעילים</span></div>'
    +filterRow("weekend","סופ״ש בלבד","יציאה בחמישי, שישי או שבת","")
    +filterRow("stay","משך שהות ביעד","כמה לילות ביעד",
        '<div class="chips">'+[1,2,3,4,5,7].map(function(d){return '<button class="chip'+(S.f.stay.days.indexOf(d)>=0?" on":"")+'" data-stay="'+d+'">'+d+'</button>';}).join("")+'</div>')
    +filterRow("departWindow","שעת המראה","רק טיסות שיוצאות בטווח הזה",
        '<div dir="ltr" class="row" style="align-items:center;font-family:var(--mono);font-size:13px">'
        +'<input type="range" min="0" max="23" value="'+dw.from+'" data-range="departWindow.from"><span>'+String(dw.from).padStart(2,"0")+':00–'+String(dw.to).padStart(2,"0")+':00</span>'
        +'<input type="range" min="0" max="23" value="'+dw.to+'" data-range="departWindow.to"></div>')
    +filterRow("connection","זמן חיבור","הרגליים הן הזמנות נפרדות — אין הגנה על החיבור",
        '<div dir="ltr" class="row" style="align-items:center;font-family:var(--mono);font-size:13px"><span>min</span>'
        +'<input type="range" min="1" max="12" value="'+cn.min+'" data-range="connection.min"><span>'+cn.min+'h</span></div>')
    +filterRow("noOvernight","בלי לינה בשדה","פוסל חיבורים שחוצים חצות","")
    +filterRow("directFirst","ישירות קודם","ממיין מסלולים קצרים למעלה","")
    +filterRow("returnRequired","רק עם חזרה זמינה","מסתיר כל הלוך שאין לו טיסת חזרה פתוחה עכשיו","")
    +'<div style="padding-top:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">מקסימום קפיצות</div>'
    +'<div class="chips">'+[1,2,3].map(function(n){return '<button class="chip ink'+(S.maxLegs===n?" on":"")+'" data-legs="'+n+'">'+n+'</button>';}).join("")+'</div></div>'
  +'</section>'

  +'<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px"><h2 style="font-family:var(--disp);font-size:22px;margin:0">'+count+' מסלולים</h2><span class="count">'+S.from+' → '+S.to+'</span></div>'
  +list
  +'<footer>Wizz AYCF · חלון הזמנות 72 שעות · כל רגל הזמנה נפרדת €9.99</footer>';

  wire();
}

function wire(){
  var app=document.getElementById("app");
  app.querySelectorAll("[data-mode]").forEach(function(b){b.onclick=function(){
    S.mode=b.getAttribute("data-mode");
    if(S.mode==="home"){S.to=(S.data&&S.data.home)||"TLV";} else {S.from=(S.data&&S.data.home)||"TLV";}
    render();};});
  app.querySelectorAll("[data-toggle]").forEach(function(b){b.onclick=function(){
    var k=b.getAttribute("data-toggle"); S.f[k].on=!S.f[k].on; render();};});
  app.querySelectorAll("[data-set]").forEach(function(s){s.onchange=function(){
    S[s.getAttribute("data-set")]=s.value; render();};});
  app.querySelectorAll("[data-legs]").forEach(function(b){b.onclick=function(){
    S.maxLegs=+b.getAttribute("data-legs"); render();};});
  app.querySelectorAll("[data-stay]").forEach(function(b){b.onclick=function(){
    var d=+b.getAttribute("data-stay"); var i=S.f.stay.days.indexOf(d);
    if(i>=0)S.f.stay.days.splice(i,1); else S.f.stay.days.push(d); render();};});
  app.querySelectorAll("[data-range]").forEach(function(r){r.oninput=function(){
    var p=r.getAttribute("data-range").split("."); S.f[p[0]][p[1]]=+r.value; render();};});
}

function pickDefaultTo(){
  var fls=flights(); if(!fls.length) return;
  var hasRoute=fls.some(function(f){return f.origin===S.from&&f.dest===S.to;});
  if(hasRoute) return;
  var c={}; fls.forEach(function(f){if(f.origin===S.from)c[f.dest]=(c[f.dest]||0)+1;});
  var best=Object.keys(c).sort(function(a,b){return c[b]-c[a];})[0];
  if(best) S.to=best;
}

function load(){
  fetch("data.json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
    S.data=d; S.err=false; pickDefaultTo(); render();
  }).catch(function(){S.err=true;render();});
}
load();
setInterval(load,120000);
</script>
</body>
</html>
